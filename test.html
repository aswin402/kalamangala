<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalamangala Form Routing Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f2e3;
      color: #1d322d;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      max-width: 500px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #1d322d;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: #f3ac85;
      color: #1d322d;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    button:hover {
      background-color: #ff894d;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Web3Forms Key Test</h2>
    <p>Use this page to verify that your access key works and sends emails to <strong>baladm@eon8.com</strong> (and CCs <strong>Info@Kalamangala.com</strong>).</p>
    
    <form action="https://api.web3forms.com/submit" method="POST">
      <!-- Your Access Key -->
      <input type="hidden" name="access_key" value="ef7f4213-bd71-441d-b5d6-dd22ef93a996">
      
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="This is a test submission." required></textarea>
      </div>

      <button type="submit">Submit Test Form</button>
    </form>
  </div>

</body>
</html>
